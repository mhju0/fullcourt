packages: []

# pnpm 10 stopped reading the "pnpm" field in package.json and moved the build-approval
# settings out of .npmrc; pnpm 11 then replaced onlyBuiltDependencies/neverBuiltDependencies
# with the allowBuilds map below. Keep the overrides in step with whatever advisory
# motivated them — ws is a CVE pin, not a preference.
overrides:
  '@babel/core@<=7.29.0': 7.29.6
  # 8.5.10 pinned an earlier advisory; 8.5.18 covered the 2026-07 pair (arbitrary file
  # read <=8.5.11, source-map path traversal <=8.5.17). Raised to 8.5.23 on 2026-08-13:
  # the incomplete-fix advisory for GHSA-6g55-p6wh-862q reaches <=8.5.22, so the old pin
  # had stopped being a fix and had become the thing holding postcss on a vulnerable
  # version. A pin is only as good as the advisory that motivated it — re-read both
  # before assuming this line is still doing its job.
  postcss@<8.5.23: 8.5.23
  # libvips CVEs inherited by sharp <0.35.0 (next's image optimizer).
  sharp@<0.35.0: '>=0.35.0'
  ws@>=8.0.0 <8.21.0: '>=8.21.0'

# Carries forward the previous policy verbatim: .npmrc allowed esbuild alone to run its
# install scripts, so everything else stayed unbuilt. msw is new to this list only because
# pnpm 11 now reports it; it was never built before either.
allowBuilds:
  esbuild: true
  msw: false
  sharp: false
  unrs-resolver: false

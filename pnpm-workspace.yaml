packages: []

# pnpm 10 stopped reading the "pnpm" field in package.json and moved the build-approval
# settings out of .npmrc; pnpm 11 then replaced onlyBuiltDependencies/neverBuiltDependencies
# with the allowBuilds map below. Keep the overrides in step with whatever advisory
# motivated them — ws is a CVE pin, not a preference.
overrides:
  # GHSA-3g3m-2fjr-6pw4 / GHSA-g3hv-75wg-m249: patched glob and minimatch for Sentry's build plugin.
  '@sentry/bundler-plugins>glob': 14.0.2
  # GHSA-jqcg-44mw-7w3h: shadcn tooling reaches this through Express.
  proxy-addr@<2.0.8: 2.0.8
  '@babel/core@<=7.29.0': 7.29.6
  # Two 2026-09-01 advisories against <=4.28.6 (GHSA-c83g-rgw3-j3cx unbounded cache growth,
  # GHSA-73wf-gq98-2v4g crash via untrusted browserslist-stats.json). Reached only through
  # next → styled-jsx → @babel/core at build time, but the --prod audit gate is zero-tolerance.
  browserslist@<4.28.7: 4.28.7
  # Seven denial-of-service advisories against 4.x and 5.x below 5.0.12. Arrived with
  # @sentry/nextjs on 2026-10-06, through its build plugin's glob. Build-time only.
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  # 8.5.10 pinned an earlier advisory; 8.5.18 covered the 2026-07 pair (arbitrary file
  # read <=8.5.11, source-map path traversal <=8.5.17). Raised to 8.5.23 on 2026-08-13:
  # the incomplete-fix advisory for GHSA-6g55-p6wh-862q reaches <=8.5.22, so the old pin
  # had stopped being a fix and had become the thing holding postcss on a vulnerable
  # version. A pin is only as good as the advisory that motivated it — re-read both
  # before assuming this line is still doing its job.
  postcss@<8.5.23: 8.5.23
  # GHSA-68fv-2mgg-jv7q (2026-10-05): event-loop denial of service through indexed source-map
  # section offsets, <1.2.2. Reached through next → postcss.
  source-map-js@<1.2.2: 1.2.2
  # GHSA-wq5f-xc86-pv6w (2026-10-06): a flaw in the librsvg that sharp bundles, <0.35.5.
  # Reached through next, for image optimisation.
  sharp@<0.35.5: 0.35.5
  ws@>=8.0.0 <8.21.0: '>=8.21.0'
  # 2026-11-05 Dependabot sweep. vite is a peer of vitest, so `pnpm update` leaves the
  # resolved 8.0.3 in place; the 8.0.x-8.1.5 advisories are patched in the 8.1.6 backport.
  # Test-only (vitest), never shipped.
  vite@>=8.0.0 <8.1.6: 8.1.6
  # GHSA-67mh-4wv8-2f99 (dev-server CORS, <=0.24.2) reaches drizzle-kit through the deprecated
  # @esbuild-kit/core-utils, which pins ~0.18.20; the 0.27.3-0.28.0 advisory reaches vite.
  # Both are dev tooling. Re-check if drizzle-kit drops @esbuild-kit.
  esbuild@<=0.24.2: 0.25.12
  esbuild@>=0.27.3 <0.28.1: 0.28.2
  # GHSA-g3hv-75wg-m249 (2026-11-05, globparts amplification, >=7.0.0 <11.0.1) has no 10.x
  # backport. Its callers here, @typescript-eslint/typescript-estree (allowDefaultProject) and
  # @ts-morph/common (shadcn tooling), only call minimatch(path, pattern[, { dot }]), which 11
  # keeps; 11 removed makeRe, regexp, AST, debug, matchOne and slashSplit. Lint and shadcn only.
  minimatch@^10.0.0: 11.0.4

# Carries forward the previous policy verbatim: .npmrc allowed esbuild alone to run its
# install scripts, so everything else stayed unbuilt. msw is new to this list only because
# pnpm 11 now reports it; it was never built before either.
allowBuilds:
  esbuild: true
  msw: false
  sharp: false
  unrs-resolver: false

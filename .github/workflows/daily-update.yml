name: Daily NBA update

permissions:
  contents: read
  actions: read

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: >-
          daily = season-gated pipeline. resync-schedule and seed-season are
          blocked pending a validated provider and the manual-source runbook.
        type: choice
        default: daily
        options:
          - daily
          - resync-schedule
          - seed-season
      season:
        description: Season label retained for the blocked seed-season task.
        type: string
        required: false

concurrency:
  group: fullcourt-daily-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DAILY_SUMMARY_PATH: daily-summary.json
    steps:
      - name: Reject blocked manual source tasks
        if: ${{ github.event.inputs.task != '' && github.event.inputs.task != 'daily' }}
        run: |
          echo '::error::This manual source is blocked from Actions. No dependencies or database credentials have been loaded. Follow docs/research/2026-10-15-pipeline-operations.md before preparing a replacement source and rehearsing a local restore.'
          exit 1

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Initialize safe pipeline telemetry
        id: telemetry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! WORKFLOW_TIMING="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '{created_at, run_started_at}')"; then
            WORKFLOW_TIMING='{}'
            echo '::warning::Actions timing unavailable; daily data work will continue with unknown schedule lateness.'
          fi
          export WORKFLOW_TIMING
          python scripts/pipeline_summary.py initialize

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/daily_update.py

      - name: Publish safe pipeline summary
        if: ${{ always() && steps.telemetry.outcome == 'success' }}
        env:
          WORKFLOW_JOB_STATUS: ${{ job.status }}
        run: python scripts/pipeline_summary.py finalize

      - name: Retain pipeline summary
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-pipeline-summary
          path: ${{ env.DAILY_SUMMARY_PATH }}
          if-no-files-found: ignore
          retention-days: 14

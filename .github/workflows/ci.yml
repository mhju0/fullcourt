name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python contract dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Run release checks
        run: scripts/check.sh --part checks

      - name: Upload production build for browser gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          include-hidden-files: true
          retention-days: 1
          path: |
            .next/
            !.next/cache/

  browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: .next
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-shell
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run secret-free rendered browser gate
        run: scripts/check.sh --part browser
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-browser-evidence
          retention-days: 7
          path: |
            playwright-smoke-report/
            test-results/smoke/

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fullcourt_ci
          POSTGRES_PASSWORD: fullcourt_ci
          POSTGRES_DB: fullcourt_ci_disposable
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U fullcourt_ci -d fullcourt_ci_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run real PostgreSQL transaction contracts
        env:
          FULLCOURT_TEST_DATABASE_URL: postgresql://fullcourt_ci:fullcourt_ci@127.0.0.1:55433/fullcourt_ci_disposable
        run: |
          pnpm exec tsx scripts/tests/prospective-refresh.pg.ts
          pnpm exec tsx scripts/tests/daily-freshness.pg.ts
          pnpm exec tsx scripts/tests/game-status.pg.ts
          pnpm exec tsx scripts/tests/game-context.pg.ts
          pnpm exec tsx scripts/tests/historical-evidence-coverage.pg.ts
          pnpm exec tsx scripts/tests/serverless-pool.pg.ts
          pnpm exec tsx scripts/tests/seed-season.pg.ts

      - name: Check entering-game records on PostgreSQL
        env:
          TEAM_RECORDS_TEST_DATABASE_URL: postgresql://fullcourt_ci:fullcourt_ci@127.0.0.1:55433/fullcourt_ci_disposable
        run: pnpm exec vitest run src/lib/__tests__/game-team-records-postgres.test.ts

  verify:
    needs: [checks, browser, postgres]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every release gate to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          for result in "$CHECKS_RESULT" "$BROWSER_RESULT" "$POSTGRES_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Release gate rejected: checks=$CHECKS_RESULT browser=$BROWSER_RESULT postgres=$POSTGRES_RESULT"
              exit 1
            fi
          done
          echo "All release gates succeeded"

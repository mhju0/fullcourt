name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:run

      - name: Run schedule contract tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Build production app
        run: pnpm build

      # Last on purpose. --prod, not a bare audit: the dev tree carries 55 advisories that never
      # reach a user, 38 of them reachable only through `shadcn` — an unscoped audit is noise
      # that teaches everyone to ignore this step. Those 38 are not removable: `shadcn` looks
      # like a scaffolding CLI but `globals.css` line 2 imports `shadcn/tailwind.css`, so it is
      # a build input and dropping it to `pnpm dlx` fails the build (measured 2026-09-01).
      # Production has sat at zero since the 2026-08-13 postcss fix, which is exactly why it is
      # worth gating: at zero, any failure here is a real regression rather than a backlog. The
      # four CVE pins that keep it there live in `pnpm-workspace.yaml` under `overrides:` — if
      # this step goes red after a lockfile change, check those first (SEASON_ROLLOVER.md §8).
      #
      # It ran first until 2026-09-02. A CVE disclosed overnight against a transitive dependency
      # would then redden every open PR and abort the job before a single correctness gate ran,
      # so no change could be verified until an override landed. An advisory is real information
      # but it is not a fact about the diff, and it must not take down the gates that are.
      - name: Audit production dependencies
        run: pnpm audit --prod

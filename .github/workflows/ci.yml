name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check documentation links
        run: pnpm docs:check

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:run

      - name: Run automation contract tests
        run: node --test scripts/tests/*.test.mjs

      - name: Run schedule contract tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Run playoff grind contract tests
        run: |
          python -m pip install --constraint ml/requirements.txt psycopg2-binary
          python -m unittest discover -s ml/tests -p 'test_*.py' -v

      - name: Build production app
        run: pnpm build

      # Run last so new advisories cannot mask correctness failures. Production-only scope
      # and the override policy are recorded in docs/DECISIONS.md D-47.
      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Upload production build for browser gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build
          include-hidden-files: true
          retention-days: 1
          path: |
            .next/
            !.next/cache/

  browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build
          path: .next
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run secret-free rendered browser gate
        run: pnpm exec playwright test --config playwright.smoke.config.ts
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-browser-evidence
          retention-days: 7
          path: |
            playwright-smoke-report/
            test-results/smoke/

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fullcourt_ci
          POSTGRES_PASSWORD: fullcourt_ci
          POSTGRES_DB: fullcourt_ci_disposable
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U fullcourt_ci -d fullcourt_ci_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run real PostgreSQL transaction contracts
        env:
          FULLCOURT_TEST_DATABASE_URL: postgresql://fullcourt_ci:fullcourt_ci@127.0.0.1:55433/fullcourt_ci_disposable
        run: |
          pnpm exec tsx scripts/tests/prospective-refresh.pg.ts
          pnpm exec tsx scripts/tests/daily-freshness.pg.ts

  verify:
    needs: [checks, browser, postgres]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every release gate to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          for result in "$CHECKS_RESULT" "$BROWSER_RESULT" "$POSTGRES_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Release gate rejected: checks=$CHECKS_RESULT browser=$BROWSER_RESULT postgres=$POSTGRES_RESULT"
              exit 1
            fi
          done
          echo "All release gates succeeded"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check documentation links
        run: pnpm docs:check

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:run

      - name: Run historical correction contract tests
        run: |
          pnpm exec vitest run --config scripts/history-correction/vitest.config.ts
          pnpm exec vitest run --config scripts/overtime-correction/vitest.config.ts
          pnpm exec vitest run --config scripts/arena-correction/vitest.config.ts

      - name: Run automation contract tests
        run: node --test scripts/tests/*.test.mjs

      - name: Install Python contract dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Run schedule contract tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Run playoff grind contract tests
        run: python -m unittest discover -s ml/tests -p 'test_*.py' -v

      - name: Build production app
        run: pnpm build

      # Run last so new advisories cannot mask correctness failures. Production-only scope
      # and the override policy are recorded in docs/DECISIONS.md D-47.
      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Upload production build for browser gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          include-hidden-files: true
          retention-days: 1
          path: |
            .next/
            !.next/cache/

  browser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: .next
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run secret-free rendered browser gate
        run: pnpm exec playwright test --config playwright.smoke.config.ts
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-browser-evidence
          retention-days: 7
          path: |
            playwright-smoke-report/
            test-results/smoke/

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fullcourt_ci
          POSTGRES_PASSWORD: fullcourt_ci
          POSTGRES_DB: fullcourt_ci_disposable
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U fullcourt_ci -d fullcourt_ci_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run real PostgreSQL transaction contracts
        env:
          FULLCOURT_TEST_DATABASE_URL: postgresql://fullcourt_ci:fullcourt_ci@127.0.0.1:55433/fullcourt_ci_disposable
        run: |
          pnpm exec tsx scripts/tests/prospective-refresh.pg.ts
          pnpm exec tsx scripts/tests/daily-freshness.pg.ts
          pnpm exec tsx scripts/tests/game-status.pg.ts
          pnpm exec tsx scripts/tests/serverless-pool.pg.ts

  verify:
    needs: [checks, browser, postgres]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every release gate to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          for result in "$CHECKS_RESULT" "$BROWSER_RESULT" "$POSTGRES_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Release gate rejected: checks=$CHECKS_RESULT browser=$BROWSER_RESULT postgres=$POSTGRES_RESULT"
              exit 1
            fi
          done
          echo "All release gates succeeded"

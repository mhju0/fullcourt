name: Probe NBA data sources

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROBE_SUMMARY_PATH: provider-summary.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Probe sources and classify diagnostics
        run: node scripts/probe-data-sources.mjs

      - name: Check the daily season gate reads ESPN's dates
        if: ${{ always() }}
        run: |
          python3 scripts/season_window.py | tee season-gate.log
          grep -q "ESPN regular season" season-gate.log

      - name: Retain safe provider summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-diagnostics
          path: ${{ env.PROBE_SUMMARY_PATH }}
          if-no-files-found: ignore
          retention-days: 14

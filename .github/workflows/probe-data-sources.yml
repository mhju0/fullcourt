name: Probe NBA data sources

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROBE_SUMMARY_PATH: provider-summary.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Probe sources and classify diagnostics
        run: node scripts/probe-data-sources.mjs

      - name: Retain safe provider summary
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-diagnostics
          path: ${{ env.PROBE_SUMMARY_PATH }}
          if-no-files-found: ignore
          retention-days: 14

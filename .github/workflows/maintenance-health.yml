name: Maintenance health

on:
  schedule:
    - cron: "43 7 * * *"
    - cron: "43 9 * * 1"
  workflow_dispatch:
    inputs:
      task:
        type: choice
        description: Read-only monitor or full dependency audit
        default: monitor
        options: [monitor, dependencies]

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.event.schedule || inputs.task }}
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event.schedule == '43 7 * * *' || (github.event_name == 'workflow_dispatch' && inputs.task == 'monitor')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check due daily scheduled run
        run: node scripts/check-daily-run.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: daily-schedule-monitor
          path: daily-watchdog.json
          if-no-files-found: warn
          retention-days: 14

  dependencies:
    if: github.event.schedule == '43 9 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.task == 'dependencies')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit all dependencies and validate result
        shell: bash
        run: |
          set +e
          pnpm audit --json > dependency-audit.json
          audit_exit=$?
          set -e
          AUDIT_EXIT_CODE="$audit_exit" node scripts/summarize-dependency-audit.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: full-dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 14

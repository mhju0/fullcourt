version: 2
# Monthly and grouped, so routine bumps arrive as at most two PRs a month (one for actions,
# one for npm). Security fixes do not wait for this schedule: Dependabot security updates
# open their own PRs as soon as an advisory lands, and CI's `pnpm audit --prod` fails on one.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # The runtime is Node 22 (CI and Vercel), so types newer than 22 would describe APIs the
    # deployed server does not have. Raise this ceiling with the runtime.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23"]

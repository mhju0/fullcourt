<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FullCourt · desktop and mobile review</title><style>*{box-sizing:border-box}body{margin:0;background:#dfe3ea;color:#17191d;font:15px system-ui}header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:white;border-bottom:1px solid #bcc4d1;flex-wrap:wrap}select,button,a{font:inherit;min-height:44px;padding:8px 12px;color:inherit}button,select{background:#fff;border:1px solid #8b95a5;border-radius:4px}button[aria-pressed=true]{background:#17191d;color:#fff}main{overflow:auto;padding:20px}iframe{display:block;border:1px solid #aab4c3;background:white;margin:auto;width:1280px;height:calc(100vh - 120px);min-height:650px}:focus-visible{outline:3px solid #4f46e5;outline-offset:3px}label{display:flex;align-items:center;gap:8px}p{margin:0;font-size:12px}</style><header><strong>FullCourt design review</strong><label>Page <select id="page"><option value="home">Homepage</option><option value="games">Games</option><option value="season">Season Report</option><option value="schedule">Schedule Edge</option><option value="shooting">Player Shooting</option><option value="shot">Shot Value</option><option value="methods">Behind the Data</option><option value="explore">Explore</option></select></label><button data-width="1280" aria-pressed="true">Desktop · 1280</button><button data-width="390" aria-pressed="false">Mobile · 390</button><a id="direct" href="home.html" target="_blank" rel="noopener">Open page ↗</a><a href="NOTES.md">Scope & sources</a><p>Composition review · real snapshots · no application routes changed</p></header><main><iframe title="FullCourt responsive mockup" src="home.html"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelector('#page').onchange=e=>{const pages={home:'home.html',games:'games.html',season:'season.html',schedule:'schedule.html',shooting:'shooting.html',shot:'shot.html',methods:'methods.html',explore:'explore.html'};const page=Object.hasOwn(pages,e.target.value)?pages[e.target.value]:pages.home;frame.src=page;document.querySelector('#direct').href=page};document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})</script></html>

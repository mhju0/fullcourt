<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shooting color options · FullCourt</title><link rel="stylesheet" href="styles.css"><style>body{padding:24px}h1{font-size:28px;margin:0 0 8px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{min-height:44px;padding:8px 14px;border:1px solid #c7cbd0;border-radius:5px;background:white;color:#17191d}button[aria-pressed=true]{background:#17191d;color:white}button:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:3px}.canvas{overflow:auto;background:#e9eaec;padding:16px}iframe{display:block;width:1280px;height:1600px;border:0;background:white}p{max-width:850px}#description{min-height:48px}a{display:inline-flex;align-items:center;min-height:44px} @media(max-width:600px){body{padding:12px}.canvas{padding:0}}</style><body><h1>Shooting by Rest · Color options</h1><p>Selected: A · Tinted difference cells. Previous alternatives are retained for reference.</p><div class="controls" aria-label="Color treatment"><button type="button" data-kind="cell" aria-pressed="true">01 · Tinted difference</button><button type="button" data-kind="bar" aria-pressed="false">02 · Centered bar</button><button type="button" data-kind="row" aria-pressed="false">03 · Row gradient</button></div><p id="description" aria-live="polite">Color stays in the difference column. The quietest treatment.</p><div class="controls" aria-label="Preview width"><button data-width="1280" aria-pressed="true">Desktop · 1280</button><button data-width="390" aria-pressed="false">Mobile · 390</button><a id="direct" href="shooting-color-cell.html">Open selected mock ↗</a></div><div class="canvas"><iframe title="Shooting table color preview" src="shooting-color-cell.html"></iframe></div><script>const descriptions={"cell": "Color stays in the difference column. The quietest treatment.", "bar": "Bars extend left for negative and right for positive. Direction and size remain readable without color.", "row": "A subtle wash spans each player row. The strongest treatment for scanning the list."};document.querySelectorAll('[data-kind]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const url=`shooting-color-${button.dataset.kind}.html`;document.querySelector('iframe').src=url;document.querySelector('#direct').href=url;document.querySelector('#description').textContent=descriptions[button.dataset.kind]});document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('iframe').style.width=button.dataset.width+'px'});</script></body></html>
